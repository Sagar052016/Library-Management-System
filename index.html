<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Library Management System</h1>
        <p>Manage your library books easily</p>

        <div class="form">
            <input type="text" id="bookName" placeholder="Enter Book Name">
            <input type="text" id="authorName" placeholder="Enter Author Name">
            <button onclick="addBook()">Add Book</button>
        </div>

        <input type="text" id="search" placeholder="Search books..." onkeyup="searchBooks()">

        <h2>Book List</h2>
        <div id="bookList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
